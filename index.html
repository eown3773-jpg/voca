<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>V-Flash | 극단적 미니멀 V단어 인출기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body {
      word-break: keep-all;
      overflow-wrap: break-word;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: pan-y;
    }
    .card-enter {
      animation: popIn 0.16s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.97) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 h-[100dvh] flex flex-col justify-between overflow-hidden selection:bg-rose-500 selection:text-white">

  <!-- MINIMAL TOP BAR -->
  <header class="pt-3 pb-2 px-4 max-w-md mx-auto w-full z-20">
    <div class="flex items-center justify-between mb-2">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-rose-500"></span>
        <span class="text-xs font-bold tracking-wider text-neutral-400">V-FLASH</span>
        <span id="progress-text" class="text-xs font-mono text-neutral-500 ml-1">1 / 160</span>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="toggleMistakeFilter()" id="btn-mistake-filter" class="px-2.5 py-1 rounded-full text-xs font-bold bg-neutral-900 text-neutral-400 border border-neutral-800 flex items-center gap-1.5 transition">
          <i class="ph-fill ph-fire text-rose-500"></i>
          <span>오답만</span>
          <span id="mistake-count" class="text-rose-400 font-mono">0</span>
        </button>
        <button onclick="resetProgress()" title="초기화" class="p-1.5 rounded-full text-neutral-500 hover:text-neutral-300 transition">
          <i class="ph-bold ph-arrow-counter-clockwise text-sm"></i>
        </button>
      </div>
    </div>

    <!-- CLEAN CHUNK TABS -->
    <div class="flex items-center gap-1.5 overflow-x-auto scrollbar-none pb-1 text-xs">
      <button onclick="setFilter('ALL')" id="tab-ALL" class="px-3 py-1 rounded-full font-bold whitespace-nowrap bg-neutral-100 text-neutral-950 transition">
        전체
      </button>
      <button onclick="setFilter('174-188')" id="tab-174-188" class="px-3 py-1 rounded-full font-bold whitespace-nowrap bg-neutral-900 text-neutral-400 border border-neutral-800 transition">
        숙어 174~188
      </button>
      <button onclick="setFilter('148-160')" id="tab-148-160" class="px-3 py-1 rounded-full font-bold whitespace-nowrap bg-neutral-900 text-neutral-400 border border-neutral-800 transition">
        숙어 148~160
      </button>
      <button onclick="setFilter('124-147')" id="tab-124-147" class="px-3 py-1 rounded-full font-bold whitespace-nowrap bg-neutral-900 text-neutral-400 border border-neutral-800 transition">
        124~147
      </button>
      <button onclick="setFilter('103-123')" id="tab-103-123" class="px-3 py-1 rounded-full font-bold whitespace-nowrap bg-neutral-900 text-neutral-400 border border-neutral-800 transition">
        103~123
      </button>
      <button onclick="setFilter('084-102')" id="tab-084-102" class="px-3 py-1 rounded-full font-bold whitespace-nowrap bg-neutral-900 text-neutral-400 border border-neutral-800 transition">
        084~102
      </button>
      <button onclick="setFilter('070-083')" id="tab-070-083" class="px-3 py-1 rounded-full font-bold whitespace-nowrap bg-neutral-900 text-neutral-400 border border-neutral-800 transition">
        070~083
      </button>
      <button onclick="setFilter('040-069')" id="tab-040-069" class="px-3 py-1 rounded-full font-bold whitespace-nowrap bg-neutral-900 text-neutral-400 border border-neutral-800 transition">
        040~069
      </button>
      <button onclick="setFilter('001-039')" id="tab-001-039" class="px-3 py-1 rounded-full font-bold whitespace-nowrap bg-neutral-900 text-neutral-400 border border-neutral-800 transition">
        001~039
      </button>
    </div>
  </header>

  <!-- MAIN SINGLE-TAP FLASHCARD -->
  <main class="flex-1 max-w-md mx-auto w-full px-4 py-2 flex flex-col justify-center">
    <div id="flashcard" onclick="flipCard()" class="w-full h-full max-h-[540px] bg-neutral-900 border border-neutral-800/90 rounded-[2rem] p-7 flex flex-col justify-between relative shadow-2xl cursor-pointer transition-transform duration-150 active:scale-[0.99]">
      
      <!-- CARD TOP META -->
      <div class="flex items-center justify-between">
        <span id="card-id" class="text-xs font-mono font-bold text-neutral-500">188</span>
        <div class="flex items-center gap-2">
          <span id="card-streak" class="text-xs font-mono text-neutral-500">0/2</span>
          <button onclick="event.stopPropagation(); speakWord();" class="p-2 -mr-2 text-neutral-400 hover:text-white transition">
            <i class="ph-bold ph-speaker-high text-lg"></i>
          </button>
        </div>
      </div>

      <!-- FRONT FACE: ONLY HEADWORD -->
      <div id="face-front" class="my-auto text-center px-2 card-enter">
        <h2 id="front-word" class="text-4xl sm:text-5xl font-black tracking-tight text-white leading-tight">
          give way to
        </h2>
        <p class="text-xs text-neutral-600 mt-6 font-medium">
          탭하여 뜻 확인
        </p>
      </div>

      <!-- BACK FACE: CORE SENSE + DETAILS -->
      <div id="face-back" class="my-auto hidden card-enter space-y-5 overflow-y-auto scrollbar-none py-2">
        <div>
          <div id="back-word" class="text-lg font-bold text-neutral-400 mb-1">give way to</div>
          <div id="back-core" class="text-2xl sm:text-3xl font-black text-rose-400 leading-snug">
            A가 B에게 밀려 대체되다 (A↓, B↑)
          </div>
        </div>

        <div class="h-px bg-neutral-800 w-full"></div>

        <div class="space-y-3 text-sm">
          <div>
            <span class="text-[11px] font-bold text-neutral-500 block mb-0.5">1차 기본 뜻</span>
            <p id="back-basic" class="text-neutral-200 font-semibold">길을 내어 주다, 양보하다</p>
          </div>
          <div>
            <span class="text-[11px] font-bold text-neutral-500 block mb-0.5">실전 급소 · 짝꿍</span>
            <p id="back-note" class="text-neutral-300 leading-relaxed whitespace-pre-line">• A give way to B: 구세대 A가 저물고 신세대 B가 부상함</p>
          </div>
        </div>
      </div>

      <!-- BOTTOM SWIPE HINT -->
      <div class="text-center">
        <span id="card-tag" class="text-[11px] font-medium text-neutral-600">
          평가원 논리 전환 시그널
        </span>
      </div>
    </div>
  </main>

  <!-- MINIMAL BOTTOM CONTROLS -->
  <footer class="pb-6 pt-2 px-4 max-w-md mx-auto w-full z-20">
    <!-- BEFORE FLIP: SINGLE BIG REVEAL BUTTON -->
    <div id="controls-front">
      <button onclick="flipCard()" class="w-full py-4 rounded-2xl bg-neutral-800 hover:bg-neutral-750 active:bg-neutral-700 text-neutral-200 font-bold text-base transition">
        정답 확인
      </button>
    </div>

    <!-- AFTER FLIP: TWO CLEAN JUDGE BUTTONS -->
    <div id="controls-back" class="hidden grid grid-cols-2 gap-3">
      <button onclick="judgeCard(false)" class="py-4 rounded-2xl bg-neutral-900 border border-rose-500/40 active:bg-rose-950/60 text-rose-400 font-black text-base flex items-center justify-center gap-2 transition">
        <i class="ph-bold ph-x text-lg"></i>
        <span>모름</span>
      </button>
      <button onclick="judgeCard(true)" class="py-4 rounded-2xl bg-rose-500 active:bg-rose-600 text-white font-black text-base flex items-center justify-center gap-2 shadow-lg shadow-rose-500/20 transition">
        <i class="ph-bold ph-check text-lg"></i>
        <span>알겠음</span>
      </button>
    </div>
  </footer>

  <!-- SUBTLE TOAST -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 px-3.5 py-1.5 bg-neutral-800 text-neutral-200 text-xs font-bold rounded-full shadow-xl pointer-events-none opacity-0 transition-opacity duration-150">
    메시지
  </div>

  <script>
    const VOCAB_DB = [
      // === 174 ~ 188 ===
      { id: "188", word: "give way to", core: "A가 B로 대체되다 (A↓, B↑)", basic: "길을 내어 주다, 양보하다", note: "• A give way to B: 구세대 A는 쇠퇴하고 신세대 B가 주류가 됨", tag: "세대교체 · 대체 공식" },
      { id: "187", word: "boil down to A", core: "결국 A로 요약·수렴되다", basic: "졸아들다, 요약되다", note: "• narrow down to A / (be) reduced to A 동일\n• 여러 갈래가 핵심 본질 A 하나로 좁혀짐", tag: "핵심 수렴 시그널" },
      { id: "186", word: "This is not to say that A", core: "그것이 A라는 뜻은 아니다 (양보 ➔ 반전)", basic: "~라고 말하는 것은 아니다", note: "• 꼬리표(양보)를 먼저 던지고 뒤에 'But / Rather'로 진짜 주장(빈칸) 제시!", tag: "양보 후 반전 공식" },
      { id: "185", word: "It is (not) that S V", core: "~때문이다 / ~때문이 아니다", basic: "~라는 것이다", note: "• 강조구문과 달리 It과 that 사이에 아무것도 없음\n• 원인·이유를 밝히는 기출 빈출 구문", tag: "이유 설명 구문" },
      { id: "184", word: "give away", core: "1) 거저 주다  2) (비밀을) 누설하다", basic: "나누어 주다, 기부하다", note: "• give away a secret: 비밀이나 정체를 무심코 폭로하다", tag: "다의어 숙어" },
      { id: "183", word: "cannot but + 동사원형", core: "~하지 않을 수 없다", basic: "~할 수밖에 없다", note: "• cannot help + -ing / cannot help but + 동사원형 동일", tag: "필수 관용 구문" },
      { id: "182", word: "rob A of B", core: "A에게서 B를 빼앗다, 박탈하다", basic: "강탈하다, 털다", note: "• strip A of B / deprive A of B 동일 구조 (전치사 of 필수)", tag: "박탈 동사 구문" },
      { id: "181", word: "deal with", core: "(문제를) 다루다, 해결하다", basic: "처리하다, 대처하다", note: "• solve a problem / cope with 동일", tag: "문제 해결 숙어" },
      { id: "180", word: "in V-ing", core: "~할 때, ~함에 있어서", basic: "~하는 중에", note: "• in doing so: 그렇게 할 때 (독해 연결 고리 빈출)", tag: "전치사 관용구" },
      { id: "179", word: "rule out", core: "제외하다, 배제하다, 불가능하게 하다", basic: "선을 그어 지우다", note: "• exclude / prevent / make impossible 동일", tag: "배제 · 차단 숙어" },
      { id: "178", word: "nothing but A", core: "오직 A만 (= only A)", basic: "A를 제외하고는 아무것도 없는", note: "• but = except (A 빼고 아무것도 없음 ➔ 결국 A뿐임)", tag: "강조 관용구" },
      { id: "177", word: "lay off", core: "1) 그만두다  2) (직원을) 해고하다", basic: "중단하다", note: "• layoff (붙여 쓰면 명사): 정리해고", tag: "다의어 숙어" },
      { id: "176", word: "take place", core: "발생하다, 일어나다 (= happen)", basic: "개최되다", note: "• 수동태 불가 자동사 표현\n• take the place of (~을 대신하다)와 구별!", tag: "문법 · 숙어 주의" },
      { id: "175", word: "give rise to", core: "(결과를) 일으키다, 야기하다 (= cause)", basic: "발생시키다", note: "• [원인 A give rise to 결과 B] 소재 간 인과관계 파악 시그널", tag: "인과관계 시그널" },
      { id: "174", word: "take over", core: "인계받다, 장악하다, 인수하다", basic: "떠맡다, 대신하다", note: "• 기업 인수(takeover) 및 주도권 장악", tag: "기본 핵심 숙어" },

      // === 148 ~ 160 ===
      { id: "160", word: "be absorbed in A", core: "A에 푹 빠지다, 몰두하다", basic: "A에 흡수되다, 열중하다", note: "• be occupied with A 동일", tag: "몰입 · 집중 숙어" },
      { id: "159", word: "replace A with B", core: "기존 A를 버리고(X) 새 B로 갈아치우다(O)", basic: "A를 B로 대체하다", note: "• substitute B for A (전치사 with vs for 공무원 단골 낚시!)", tag: "대체 · 전치사 킬러" },
      { id: "158", word: "even so", core: "그렇기는 하지만, 그럼에도 불구하고", basic: "설령 그렇다 하더라도", note: "• 앞 문장 인정 후 역접 반전 (= nevertheless)", tag: "역접 접속부사" },
      { id: "157", word: "as 형용사 as", core: "[문두 도치] 비록 ~일지라도 (양보)", basic: "~만큼 ~한", note: "• Important as it is = Although it is important (뒤에 반전 예고)", tag: "양보 도치 구문" },
      { id: "156", word: "A is to B as C is to D", core: "A와 B의 관계는 C와 D의 관계와 같다", basic: "비례 유추 공식 (A:B = C:D)", note: "• What A is to B, C is to D 동일", tag: "비례 유추 공식" },
      { id: "155", word: "distinction between A and B", core: "A와 B의 명확한 대립·차이 선언", basic: "A와 B 사이의 구별", note: "• gap between A and B 동일 (A ↔ B 대립쌍 구조)", tag: "대립쌍 시그널" },
      { id: "154", word: "be programmed to V", core: "선천적으로 타고나다, 내재되다", basic: "~하도록 프로그램 되어 있다", note: "• innate, inborn, hardwired와 같은 선천성 패밀리", tag: "선천성 시그널" },
      { id: "153", word: "confuse A with B", core: "A와 B를 구별 못 하고 착각하다", basic: "A와 B를 혼동하다", note: "• 필자가 대중의 논리적 오류를 지적할 때 사용", tag: "오류 지적 구문" },
      { id: "152", word: "aside from A", core: "A는 별개로 하고, A 외에도 (= apart from)", basic: "A를 제외하고", note: "• A 이야기는 끝내고 B라는 새로운 화제로 전환하는 시그널", tag: "화제 전환 시그널" },
      { id: "151", word: "attend to", core: "1) 주의를 기울이다  2) (용무를) 처리하다", basic: "돌보다, 시중들다", note: "• attend the meeting(타동사: 참석하다)과 전치사 유무 구별", tag: "자·타동사 킬러" },
      { id: "150", word: "A is a window into B", core: "A를 통해 B의 내막을 들여다볼 수 있다", basic: "A는 B를 보는 창이다", note: "• A = B를 이해하는 통찰의 도구", tag: "비유 독해 공식" },
      { id: "149", word: "removed from A", core: "A로부터 멀리 떨어진, 동떨어진", basic: "A로부터 제거된", note: "• far removed from reality: 현실과 거리가 아주 먼", tag: "거리 · 단절 숙어" },
      { id: "148", word: "not A until B", core: "B하고 나서야 비로소 A하다 (순서: B ➔ A)", basic: "B할 때까지 A하지 않다", note: "• Not until B did A... (공무원 부정어 도치 0순위)", tag: "시간 순서 · 도치" },

      // === 124 ~ 147 ===
      { id: "147", word: "other than A", core: "A 이외의, A를 제외하고 (= except)", basic: "A와 다른", note: "• nothing other than A = only A", tag: "예외 · 부정 숙어" },
      { id: "146", word: "not so much A as B", core: "A라기보다는 B이다 (A 기각, B 강조)", basic: "A만큼 B는 아니다", note: "• B rather than A / not A but B 동일 (주제문 시그널)", tag: "주제문 강조 공식" },
      { id: "145", word: "A is a product of B", core: "[원인 B ➔ 결과 A] A는 B의 산물이다", basic: "A는 B의 창조물이다", note: "• A is a function of B 동일", tag: "인과 귀속 공식" },
      { id: "144", word: "at worst", core: "최악의 경우에는 (-)", basic: "가장 나빠도", note: "• 부정적 극단 상황 가정", tag: "극단 가정 숙어" },
      { id: "143", word: "at best", core: "기껏해야, 잘해야 고작 (= only) (-)", basic: "최선의 상태에서", note: "• 대상의 한계를 깎아내리는 마이너스(-) 시그널", tag: "한계 비판 시그널" },
      { id: "142", word: "it follows that S V", core: "따라서 ~라는 결론에 이른다 (주제문)", basic: "뒤이어 ~가 오다", note: "• 논리적 필연 결론 도출 시그널", tag: "결론 도출 시그널" },
      { id: "141", word: "contribute to", core: "[원인 A ➔ 결과 B] A가 B의 원인이 되다", basic: "~에 공헌하다, 기여하다", note: "• 좋은 일뿐 아니라 'contribute to disease(질병의 원인이 되다)' 빈출", tag: "인과관계 동사" },
      { id: "140", word: "turn sour", core: "(관계·일이) 틀어지다, 잘못되다 (-)", basic: "음식이 시어지다, 상하다", note: "• partnership turned sour: 동업 관계가 틀어졌다", tag: "비유 관용구" },
      { id: "139", word: "be it A or B", core: "A이든 B이든 간에 (= whether it be A or B)", basic: "양보 도치 구문", note: "• whether 생략으로 동사 be가 문두로 도치됨", tag: "양보 도치 구문" },
      { id: "138", word: "code", core: "행동 규범, 수칙, 관례, 법전", basic: "암호, 부호", note: "• code of conduct (행동 수칙) / penal code (형법전)", tag: "사회 · 법학 다의어" },
      { id: "137", word: "mechanical", core: "영혼 없는, 무감각한, 형식적인 (-)", basic: "기계의, 기계적인", note: "• mechanical answer: 진심이 안 담긴 기계적 답변", tag: "방향성 (-) 어휘" },
      { id: "136", word: "authorize", core: "권한을 부여하다, 공인하다, 허가하다", basic: "권위를 주다", note: "• authorized biography: 공인된 전기", tag: "권한 파생어" },

      { id: "002", word: "affect", core: "[명사] 감정, 정서 (= emotion) / [동사] 감정을 유발하다", basic: "영향을 미치다", note: "• affective: 정서적인 (심리·인문 지문 1순위 다의어)", tag: "심리학 다의어" },
      { id: "001", word: "attitude (vs altitude/latitude/aptitude)", core: "attitude: 태도 / altitude: 고도 / latitude: 위도·자유재량 / aptitude: 적성", basic: "태도, 입장", note: "• longitude: 경도 / gratitude: 감사 (형태 낚시 5총사)", tag: "혼동어 5총사" }

    let activeDeck = [];
    let currentIdx = 0;
    let isFlipped = false;
    let currentFilter = 'ALL';
    let onlyMistakes = false;
    let streaks = {};
    let mistakes = {};

    // Swipe gesture variables
    let touchStartX = 0;
    let touchEndX = 0;

    function init() {
      try {
        streaks = JSON.parse(localStorage.getItem('vflash_streaks') || '{}');
        mistakes = JSON.parse(localStorage.getItem('vflash_mistakes') || '{}');
      } catch(e) {}
      applyFilter();
      setupSwipe();
    }

    function saveState() {
      localStorage.setItem('vflash_streaks', JSON.stringify(streaks));
      localStorage.setItem('vflash_mistakes', JSON.stringify(mistakes));
      updateCounts();
    }

    function setFilter(filterKey) {
      currentFilter = filterKey;
      onlyMistakes = false;
      
      document.querySelectorAll('[id^="tab-"]').forEach(btn => {
        btn.className = "px-3 py-1 rounded-full font-bold whitespace-nowrap bg-neutral-900 text-neutral-400 border border-neutral-800 transition";
      });
      const activeTab = document.getElementById(`tab-${filterKey}`);
      if (activeTab) {
        activeTab.className = "px-3 py-1 rounded-full font-bold whitespace-nowrap bg-neutral-100 text-neutral-950 transition";
      }

      document.getElementById('btn-mistake-filter').className = "px-2.5 py-1 rounded-full text-xs font-bold bg-neutral-900 text-neutral-400 border border-neutral-800 flex items-center gap-1.5 transition";
      applyFilter();
    }

    function toggleMistakeFilter() {
      onlyMistakes = !onlyMistakes;
      const btn = document.getElementById('btn-mistake-filter');
      if (onlyMistakes) {
        btn.className = "px-2.5 py-1 rounded-full text-xs font-bold bg-rose-500/20 text-rose-300 border border-rose-500/50 flex items-center gap-1.5 transition";
        showToast("오답 단어만 모았습니다");
      } else {
        btn.className = "px-2.5 py-1 rounded-full text-xs font-bold bg-neutral-900 text-neutral-400 border border-neutral-800 flex items-center gap-1.5 transition";
      }
      applyFilter();
    }

    function applyFilter() {
      let list = [...VOCAB_DB];
      if (currentFilter !== 'ALL') {
        const [min, max] = currentFilter.split('-').map(Number);
        list = list.filter(item => {
          const num = parseInt(item.id.split('-')[0], 10);
          return num >= min && num <= max;
        });
      }

      if (onlyMistakes) {
        list = list.filter(item => (mistakes[item.id] || 0) > 0 && (streaks[item.id] || 0) < 2);
        if (list.length === 0) {
          showToast("오답 노트가 비어 있습니다!");
          onlyMistakes = false;
          document.getElementById('btn-mistake-filter').className = "px-2.5 py-1 rounded-full text-xs font-bold bg-neutral-900 text-neutral-400 border border-neutral-800 flex items-center gap-1.5 transition";
          list = [...VOCAB_DB];
        }
      }

      activeDeck = list;
      currentIdx = 0;
      renderCard();
      updateCounts();
    }

    function updateCounts() {
      const mCount = VOCAB_DB.filter(item => (mistakes[item.id] || 0) > 0 && (streaks[item.id] || 0) < 2).length;
      document.getElementById('mistake-count').innerText = mCount;
    }

    function renderCard() {
      if (activeDeck.length === 0) return;
      if (currentIdx >= activeDeck.length) currentIdx = 0;

      const item = activeDeck[currentIdx];
      const st = streaks[item.id] || 0;

      document.getElementById('progress-text').innerText = `${currentIdx + 1} / ${activeDeck.length}`;
      document.getElementById('card-id').innerText = `No. ${item.id}`;
      document.getElementById('card-streak').innerText = `${st}/2`;
      document.getElementById('card-tag').innerText = item.tag || "";

      document.getElementById('front-word').innerText = item.word;
      document.getElementById('back-word').innerText = item.word;
      document.getElementById('back-core').innerText = item.core;
      document.getElementById('back-basic').innerText = item.basic;
      document.getElementById('back-note').innerText = item.note;

      isFlipped = false;
      updateFace();
    }

    function flipCard() {
      if (!isFlipped) {
        isFlipped = true;
        updateFace();
      }
    }

    function updateFace() {
      const front = document.getElementById('face-front');
      const back = document.getElementById('face-back');
      const ctrlFront = document.getElementById('controls-front');
      const ctrlBack = document.getElementById('controls-back');

      if (isFlipped) {
        front.classList.add('hidden');
        back.classList.remove('hidden');
        ctrlFront.classList.add('hidden');
        ctrlBack.classList.remove('hidden');
      } else {
        front.classList.remove('hidden');
        back.classList.add('hidden');
        ctrlFront.classList.remove('hidden');
        ctrlBack.classList.add('hidden');
      }
    }

    function judgeCard(known) {
      if (activeDeck.length === 0) return;
      const item = activeDeck[currentIdx];

      if (known) {
        streaks[item.id] = (streaks[item.id] || 0) + 1;
        if (streaks[item.id] >= 2) {
          mistakes[item.id] = 0;
          showToast("완벽 암기 완료");
        }
        currentIdx++;
      } else {
        streaks[item.id] = 0;
        mistakes[item.id] = (mistakes[item.id] || 0) + 1;
        showToast("2장 뒤에 다시 나옵니다");

        // Reinsert 2 cards later
        const failed = activeDeck.splice(currentIdx, 1)[0];
        const targetPos = Math.min(currentIdx + 2, activeDeck.length);
        activeDeck.splice(targetPos, 0, failed);
      }

      saveState();
      renderCard();
    }

    function speakWord() {
      if (activeDeck.length === 0) return;
      const clean = activeDeck[currentIdx].word.replace(/\(.*\)/g, '').trim();
      const uttr = new SpeechSynthesisUtterance(clean);
      uttr.lang = 'en-US';
      uttr.rate = 0.92;
      window.speechSynthesis.speak(uttr);
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.innerText = msg;
      el.classList.remove('opacity-0');
      el.classList.add('opacity-100');
      setTimeout(() => {
        el.classList.remove('opacity-100');
        el.classList.add('opacity-0');
      }, 1000);
    }

    function resetProgress() {
      if (confirm("학습 기록을 초기화할까요?")) {
        streaks = {};
        mistakes = {};
        saveState();
        setFilter('ALL');
        showToast("초기화되었습니다");
      }
    }

    function setupSwipe() {
      const card = document.getElementById('flashcard');
      card.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      card.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, { passive: true });
    }

    function handleSwipe() {
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) < 50) return;
      if (!isFlipped) {
        flipCard();
        return;
      }
      if (diff < 0) {
        judgeCard(false);
      } else {
        judgeCard(true);
      }
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.key === 'Enter') {
        e.preventDefault();
        if (!isFlipped) flipCard();
        else judgeCard(true);
      } else if (e.key === '1' || e.key === 'ArrowLeft') {
        if (isFlipped) judgeCard(false);
      } else if (e.key === '2' || e.key === 'ArrowRight') {
        if (isFlipped) judgeCard(true);
      }
    });

    init();
  </script>
</body>
</html>
